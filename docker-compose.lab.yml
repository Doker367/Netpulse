# ============================================================
# NetPulse — Laboratorio de Simuladores de Red
# ============================================================
# Para desarrollo/testing local con dispositivos multivendor.
# Usa FRRouting (Open Source) como base de routing.
#
# Para vendors específicos (requiere licencias/imágenes):
#   - Cisco IOSv/IOSvL2: Cisco CML/VIRL
#   - Juniper vJunOS: Juniper vLabs
#   - Arista vEOS: Arista (registro gratuito)
# ============================================================

services:
  # ----------------------------------------------------------
  # Router "Cisco-like" — FRRouting con CLI tipo Cisco
  # Puertos: SSH 2222, BGP 179
  # NAPALM driver: ios (usa CLI Cisco-like de FRR)
  # ----------------------------------------------------------
  router-cisco:
    build: ./docker/frr
    image: netpulse-frr-cisco:latest
    container_name: netpulse-cisco
    hostname: cisco-core-01
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    volumes:
      - ./docker/frr/cisco/daemons:/etc/frr/daemons
      - ./docker/frr/cisco/frr.conf:/etc/frr/frr.conf
      - ./docker/frr/cisco/vtysh.conf:/etc/frr/vtysh.conf
    ports:
      - "2222:22"    # SSH para NAPALM
    networks:
      lab-net:                 # eth0 = gestión (primer orden → eth0)
        ipv4_address: 172.30.0.10
      core-net:                # eth1 = segmento Core cisco↔juniper
        ipv4_address: 172.30.1.10
      access-net:              # eth2 = segmento Access cisco↔switch
        ipv4_address: 172.30.2.10
    restart: unless-stopped

  # ----------------------------------------------------------
  # Router "Juniper-like" — FRRouting (mismo software, 
  # diferente personalidad. Juniper real requiere vJunOS)
  # ----------------------------------------------------------
  router-juniper:
    build: ./docker/frr
    image: netpulse-frr-juniper:latest
    container_name: netpulse-juniper
    hostname: juniper-edge-01
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    volumes:
      - ./docker/frr/juniper/daemons:/etc/frr/daemons
      - ./docker/frr/juniper/frr.conf:/etc/frr/frr.conf
      - ./docker/frr/juniper/vtysh.conf:/etc/frr/vtysh.conf
    ports:
      - "2223:22"    # SSH para NAPALM
    networks:
      lab-net:
        ipv4_address: 172.30.0.11
      core-net:                # eth1 = segmento Core cisco↔juniper
        ipv4_address: 172.30.1.11
      dmz-net:                 # eth2 = segmento DMZ juniper↔mikrotik
        ipv4_address: 172.30.3.11
    restart: unless-stopped

  # ----------------------------------------------------------
  # MikroTik RouterOS 7.22 — API en 8728, SSH en 2225
  # NAPALM driver: ros (usa API, no SSH)
  # ----------------------------------------------------------
  router-mikrotik:
    image: vaerh/routeros:latest
    container_name: netpulse-mikrotik
    hostname: mikrotik-edge-01
    privileged: true
    volumes:
      # El /routeros completo (disco .vdi + scripts del entrypoint) vive
      # FUERA del contenedor: al hacer up --force-recreate la configuración
      # del RouterOS (API 8728, usuarios, LLDP...) sobrevive. Para resetear
      # de fábrica: borra docker/routeros/rootfs/ y vuelve a crearla con
      #   docker create tmp vaerh/routeros && docker cp tmp:/routeros/. docker/routeros/rootfs/
      - ./docker/routeros/rootfs:/routeros
    ports:
      - "2225:22"     # SSH (admin sin password)
      - "8728:8728"   # API (NAPALM usa este)
      - "8291:8291"   # Winbox
    networks:
      dmz-net:                 # ÚNICA red del ROS (imagen qemu de 1 NIC):
        ipv4_address: 172.30.3.13   # ether1 = segmento DMZ juniper↔mikrotik.
    restart: unless-stopped      # LLDP aquí = enlace real en el mapa.

  # ----------------------------------------------------------
  # Arista vEOS 4.27.3F — eAPI en 443, SSH en 2226
  # NAPALM driver: eos (usa eAPI HTTPS)
  # Credenciales: vrnetlab / (definidas con NETPULSE_LAB_PASSWORD)
  # ----------------------------------------------------------
  router-arista:
    image: cminsg/vr-veos:4.27.3F
    container_name: netpulse-arista
    hostname: arista-core-01
    # vEOS es x86_64 y arranca QEMU dentro del contenedor: necesita un host
    # x86_64 con virtualización. En Apple Silicon (arm64) no arranca
    # ("Unable to connect to qemu monitor"). Por eso queda tras un profile;
    # actívalo solo en hosts compatibles:
    #   docker compose -f docker-compose.lab.yml --profile arista up -d
    profiles: ["arista"]
    platform: linux/amd64
    privileged: true
    ports:
      - "2226:22"     # SSH
      - "443:443"     # eAPI (NAPALM usa este)
    networks:
      lab-net:
        ipv4_address: 172.30.0.14

  # ----------------------------------------------------------
  # Switch Capa 2 — FRRouting con bridge
  # ----------------------------------------------------------
  switch-l2:
    build: ./docker/frr
    image: netpulse-frr-switch:latest
    container_name: netpulse-switch
    hostname: switch-access-01
    privileged: true
    cap_add:
      - NET_ADMIN
      - SYS_ADMIN
    volumes:
      - ./docker/frr/switch/daemons:/etc/frr/daemons
      - ./docker/frr/switch/frr.conf:/etc/frr/frr.conf
      - ./docker/frr/switch/vtysh.conf:/etc/frr/vtysh.conf
    ports:
      - "2224:22"
    networks:
      lab-net:                 # eth0 = gestión (primer orden → eth0)
        ipv4_address: 172.30.0.12
      access-net:              # eth1 = segmento Access cisco↔switch
        ipv4_address: 172.30.2.12
    restart: unless-stopped

networks:
  lab-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
  core-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.1.0/24
  access-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.2.0/24
  dmz-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.3.0/24
