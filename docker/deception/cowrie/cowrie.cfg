# Cowrie — configuración de la red señuelo NetPulse
# Referencia: https://cowrie.readthedocs.io

[honeypot]
hostname = srv-files-01

[ssh]
enabled = true
# Puerto 2222 dentro del contenedor (no requiere root). La red señuelo
# lo alcanza en cowrie:2222.
listen_endpoints = tcp:2222:interface=0.0.0.0

[telnet]
enabled = true
listen_endpoints = tcp:2223:interface=0.0.0.0

# Log JSON por línea: es el formato que normaliza el tailer de NetPulse.
[output_jsonlog]
enabled = true
logfile = var/log/cowrie/cowrie.json
epoch_timestamp = false
