! FRR config — Cisco-like core router
hostname cisco-core-01

! Interfaces
interface lo
 ip address 10.0.0.1/32
!
interface eth0
 ip address 172.30.0.10/24
 description "Lab management network"
!

! BGP Configuration
router bgp 65001
 bgp router-id 10.0.0.1
 neighbor 172.30.0.11 remote-as 65002
 neighbor 172.30.0.11 description "Juniper Edge"

! OSPF
router ospf
 ospf router-id 10.0.0.1
 network 172.30.0.0/24 area 0

! Static test routes
ip route 192.168.10.0/24 172.30.0.11
ip route 192.168.20.0/24 172.30.0.11
