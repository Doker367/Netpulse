! FRR config — Access switch
! NOTE: las IPs las asigna docker-compose (IPAM) por red; no setear IPs
! estáticas por interfaz porque el orden eth0/eth1 no es determinista.
hostname switch-access-01

interface eth0
 description "Lab interfaces (IPs por docker IPAM)"
!

! Static default to core (via lab-net mgmt gateway del host docker)
ip route 0.0.0.0/0 172.30.0.1
