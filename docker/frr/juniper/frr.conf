! FRR config — Juniper-like edge router
hostname juniper-edge-01

! Interfaces
interface lo
 ip address 10.0.0.2/32
!
interface eth0
 ip address 172.30.0.11/24
 description "Lab management network"
!

! BGP
router bgp 65002
 bgp router-id 10.0.0.2
 neighbor 172.30.0.10 remote-as 65001
 neighbor 172.30.0.10 description "Cisco Core"

! OSPF
router ospf
 ospf router-id 10.0.0.2
 network 172.30.0.0/24 area 0
