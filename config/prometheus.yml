global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - '/etc/prometheus/rules/*.yml'

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'netpulse-api'
    metrics_path: '/api/metrics'
    static_configs:
      # host.docker.internal: la API corre en el host (macOS/Linux).
      # En Linux añadir extra_hosts: host-gateway (ya incluido en el compose).
      - targets: ['host.docker.internal:8082']
    scrape_interval: 15s
