services:
  prometheus:
    image: prom/prometheus:latest
    container_name: netpulse-prometheus
    network_mode: host
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./config/prometheus-rules.yml:/etc/prometheus/rules/rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
      - '--web.listen-address=0.0.0.0:9090'
      # Retención larga para capacity planning (90 días)
      - '--storage.tsdb.retention.time=90d'
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:latest
    container_name: netpulse-alertmanager
    # network_mode host: igual que Prometheus (necesita alcanzar la API
    # del host en :8082 vía host.docker.internal no resuelve con host net;
    # por eso el webhook apunta a 127.0.0.1:8082 en alertmanager.yml)
    network_mode: host
    volumes:
      - ./config/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--web.listen-address=0.0.0.0:9093'
    restart: unless-stopped

  loki:
    image: grafana/loki:latest
    container_name: netpulse-loki
    ports:
      - "3100:3100"
    volumes:
      - ./config/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki_data:/loki
    command:
      - '-config.file=/etc/loki/loki-config.yml'
    networks:
      - monitoring
    restart: unless-stopped

  promtail:
    image: grafana/promtail:latest
    container_name: netpulse-promtail
    volumes:
      - ./config/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/log:/var/log:ro
    command:
      - '-config.file=/etc/promtail/config.yml'
    networks:
      - monitoring
    restart: unless-stopped
    depends_on:
      - loki

networks:
  monitoring:
    driver: bridge

volumes:
  prometheus_data:
  loki_data:
  alertmanager_data:
